services:
  db:
    image: postgres:15
    container_name: building_energy_pg
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: building_energy
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ../app/core/sql/base_tables.sql:/docker-entrypoint-initdb.d/01-base_tables.sql:ro
      - ../app/core/sql/meter_daily_agg.sql:/docker-entrypoint-initdb.d/02-meter_daily_agg.sql:ro
      - ../app/core/sql/anomaly_events.sql:/docker-entrypoint-initdb.d/03-anomaly_events.sql:ro
      - ../app/core/sql/ai_anomaly_feedback.sql:/docker-entrypoint-initdb.d/04-ai_anomaly_feedback.sql:ro
      - ../app/core/sql/ai_qa_sessions.sql:/docker-entrypoint-initdb.d/05-ai_qa_sessions.sql:ro
      - ../app/core/sql/create_indexes.sql:/docker-entrypoint-initdb.d/06-create_indexes.sql:ro
      - ../app/core/sql/reports.sql:/docker-entrypoint-initdb.d/07-reports.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d building_energy"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: building_energy_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      - ./ai_settings.json:/app/data/runtime/ai_settings.json
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: building_energy_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: 18313899771@163.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
